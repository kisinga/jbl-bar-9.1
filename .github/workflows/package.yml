name: Test and package toolkit

on:
  pull_request:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this version from main as a downloadable prerelease
        type: boolean
        default: false

# Serialize publishing and allow a failed draft to be repaired on retry.
concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Check version, changelog and release source before expensive work
        env:
          PUBLISH: ${{ inputs.publish || 'false' }}
          REF: ${{ github.ref }}
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/release.py check
          if [[ "$REF" == refs/tags/* ]]; then
            python3 tools/release.py check --tag "$TAG"
            git merge-base --is-ancestor HEAD origin/main
          fi
          if [[ "$PUBLISH" == true ]]; then
            [[ "$REF" == refs/heads/main ]] || { echo 'Publish must run from main'; exit 1; }
            tag="$(python3 -c 'import sys; sys.path.insert(0,"tools"); import build_usb; print("v" + build_usb.VERSION)')"
            if git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
              [[ "$(git rev-parse "refs/tags/$tag^{commit}")" == "$GITHUB_SHA" ]] || { echo 'Version tag already belongs to another commit. Bump VERSION and update CHANGELOG.md.'; exit 1; }
            fi
            # Fail early for already published versions; API failures also fail this step.
            gh release list --limit 1000 --json tagName,isDraft > "$RUNNER_TEMP/releases.json"
            python3 - "$tag" "$RUNNER_TEMP/releases.json" <<'PY'
          import json, sys
          if any(r['tagName'] == sys.argv[1] and not r['isDraft'] for r in json.load(open(sys.argv[2]))):
              sys.exit('Version already published. Bump VERSION and update CHANGELOG.md.')
          PY
          fi

  test:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.5'
          cache: false
      - name: Install host fixture dependencies
        run: sudo apt-get update && sudo apt-get install -y busybox
      - name: Host fixtures and immutable standalone baseline
        run: python3 tools/test.py
      - name: Go race checks and vet
        working-directory: apps/remote
        run: |
          go test -race ./...
          go vet ./...
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.16.0'
      - name: Install browser fixture tools
        run: |
          npm install --prefix build/ui-tools --no-save --package-lock=false playwright@1.63.0
          build/ui-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Browser, component and offline setup regressions
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/build/ui-tools/node_modules/playwright/index.mjs
        run: |
          node tests/webremote-ui.mjs
          node tests/component-ui.mjs
          node tests/setup-ui.mjs
          node tests/bass-offset-ui.mjs
      - name: Select reviewed package implementations
        id: targets
        run: |
          python3 - <<'PY'
          import os, subprocess
          matrix = subprocess.check_output(['python3', 'tools/build_distribution.py', '--matrix'], text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('matrix=' + matrix + '\n')
          PY

  package:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.test.outputs.matrix) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.5'
          cache: false
      - run: sudo apt-get update && sudo apt-get install -y busybox
      - name: Build public USB and independent recovery ZIPs
        env:
          PACKAGE_MODEL: ${{ matrix.model }}
        run: python3 tools/build_distribution.py --model "$PACKAGE_MODEL"
      # Explicit public files only. Never upload dist/, private configs or blobs.
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/release/*-usb.zip
            dist/release/*-recovery.zip
            dist/release/*SHA256SUMS
            dist/release/*release.json
          if-no-files-found: error
          retention-days: 30
      - name: Explain the download
        env:
          ARTIFACT_NAME: ${{ matrix.artifact }}
        run: |
          printf 'Download **%s** from Artifacts. Extract the wrapper, then extract **-usb.zip** to FAT32 and open **SETUP.html**. Keep **-recovery.zip**.\n\nHardware selection is automatic; only included, reviewed implementations can run. Combined hardware qualification remains pending.\n' "$ARTIFACT_NAME" >> "$GITHUB_STEP_SUMMARY"

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main')
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: jbl-*-usb-development
          merge-multiple: true
          path: release-assets
      - name: Verify complete assets and create the release with its changelog
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "$REF_TYPE" == tag ]]; then
            python3 tools/release.py publish --draft
          else
            python3 tools/release.py publish
          fi
      - name: Link the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(python3 -c 'import sys; sys.path.insert(0,"tools"); import build_usb; print("v" + build_usb.VERSION)')"
          gh release view "$tag" --json url --jq '"Download USB and recovery packages: " + .url' >> "$GITHUB_STEP_SUMMARY"
