name: Test and package toolkit

on:
  pull_request:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this version from main as a downloadable prerelease
        type: boolean
        default: false

# Cancel obsolete validation; publishing has its own serialized group.
concurrency:
  group: package-${{ (github.event_name == 'workflow_dispatch' && inputs.publish || startsWith(github.ref, 'refs/tags/')) && 'publish' || github.ref }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs.publish) && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      host: ${{ steps.scope.outputs.host }}
      native: ${{ steps.scope.outputs.native }}
      remote: ${{ steps.scope.outputs.remote }}
      ui: ${{ steps.scope.outputs.ui }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Check version, changelog and release source before expensive work
        env:
          PUBLISH: ${{ inputs.publish || 'false' }}
          REF: ${{ github.ref }}
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/release.py check
          if [[ "$REF" == refs/tags/* ]]; then
            python3 tools/release.py check --tag "$TAG"
            git merge-base --is-ancestor HEAD origin/main
          fi
          if [[ "$PUBLISH" == true ]]; then
            [[ "$REF" == refs/heads/main ]] || { echo 'Publish must run from main'; exit 1; }
            tag="$(python3 -c 'import sys; sys.path.insert(0,"tools"); import build_usb; print("v" + build_usb.VERSION)')"
            if git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
              [[ "$(git rev-parse "refs/tags/$tag^{commit}")" == "$GITHUB_SHA" ]] || { echo 'Version tag already belongs to another commit. Bump VERSION and update CHANGELOG.md.'; exit 1; }
            fi
            # Fail early for already published versions; API failures also fail this step.
            gh release list --limit 1000 --json tagName,isDraft > "$RUNNER_TEMP/releases.json"
            python3 - "$tag" "$RUNNER_TEMP/releases.json" <<'PY'
          import json, sys
          if any(r['tagName'] == sys.argv[1] and not r['isDraft'] for r in json.load(open(sys.argv[2]))):
              sys.exit('Version already published. Bump VERSION and update CHANGELOG.md.')
          PY
          fi

      - name: Select checks (full validation for pushes and releases)
        id: scope
        run: python3 tools/ci.py --github-output "$GITHUB_OUTPUT"

  host:
    needs: preflight
    if: needs.preflight.outputs.host == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            apps/remote/go.mod
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.16.0'
      - name: Install host fixture dependencies
        timeout-minutes: 3
        run: |
          # The Azure mirror has stalled font downloads for minutes in CI.
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update
          sudo apt-get install -y busybox dosfstools
      - name: Host fixtures and immutable standalone baseline
        run: python3 tools/test.py --artifacts build/ci-packages
      - name: Portable setup race checks and vet
        run: |
          go test -race ./apps/build ./apps/usbsetup ./internal/buildtool ./internal/usbsetup ./packaging
          go vet ./apps/build ./apps/usbsetup ./internal/buildtool ./internal/usbsetup ./packaging
      - name: Record fixture timings
        if: always()
        run: |
          if [[ -f build/test-results/timings.json ]]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          print('### Host fixture timings\n\n| Suite | Seconds |\n| --- | ---: |')
          for name, elapsed in sorted(json.load(open('build/test-results/timings.json')).items(), key=lambda item: -item[1]):
              print(f'| {name} | {elapsed:.1f} |')
          PY
          fi
      # These exact files passed distribution, checksum and legacy-byte checks.
      # Upload explicit public paths only; never dist/, private configs or blobs.
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: jbl-bar-toolkit-usb-development
          path: |
            build/ci-packages/auto/*-usb.zip
            build/ci-packages/auto/*-recovery.zip
            build/ci-packages/auto/jbl-setup-*
            build/ci-packages/auto/*-setup-*.zip
            build/ci-packages/auto/SHA256SUMS
            build/ci-packages/auto/release.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: jbl-bar91-usb-development
          path: |
            build/ci-packages/bar91/*-usb.zip
            build/ci-packages/bar91/*-recovery.zip
            build/ci-packages/bar91/*SHA256SUMS
            build/ci-packages/bar91/*release.json
          if-no-files-found: error
          retention-days: 30

  remote:
    needs: preflight
    if: needs.preflight.outputs.remote == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            apps/remote/go.mod
      - name: Preserve the frozen remote control inventory
        run: python3 tests/check_remote_ui.py
      - name: Remote race checks, vet and ARM embedded-asset build
        working-directory: apps/remote
        run: |
          go test -race ./...
          go vet ./...
          GOOS=linux GOARCH=arm GOARM=7 CGO_ENABLED=0 go build -trimpath -o ../../build/ci-remote .

  browser:
    needs: preflight
    if: needs.preflight.outputs.ui != 'none'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            apps/remote/go.mod
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.16.0'
          cache: npm
      - name: Install pinned browser tools
        timeout-minutes: 3
        run: npm ci --no-audit --no-fund --fetch-retries=2 --fetch-timeout=30000
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install browser system libraries
        timeout-minutes: 3
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          npx --no-install playwright install-deps chromium
      - name: Install headless Chromium (reuses browser cache)
        timeout-minutes: 3
        run: npx --no-install playwright install --only-shell chromium
      - name: Browser, component and portable setup regressions
        env:
          SUITE: ${{ needs.preflight.outputs.ui }}
        run: |
          npm run test:ui -- --suite "$SUITE"

  setup-native:
    needs: preflight
    if: needs.preflight.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            apps/remote/go.mod
      - name: Portable setup fixtures (temporary directories only)
        run: |
          go test ./apps/build ./apps/usbsetup ./internal/buildtool ./internal/usbsetup ./packaging
          go vet ./apps/build ./apps/usbsetup ./internal/buildtool ./internal/usbsetup ./packaging

  # One stable required check also succeeds for documentation-only changes.
  test:
    if: always()
    needs: [preflight, host, remote, browser, setup-native]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Require every selected check to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 tools/ci.py --verify

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main')
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: jbl-*-usb-development
          merge-multiple: true
          path: release-assets
      - name: Verify complete assets and create the release with its changelog
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "$REF_TYPE" == tag ]]; then
            python3 tools/release.py publish --draft
          else
            python3 tools/release.py publish
          fi
      - name: Link the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(python3 -c 'import sys; sys.path.insert(0,"tools"); import build_usb; print("v" + build_usb.VERSION)')"
          gh release view "$tag" --json url --jq '"Download USB and recovery packages: " + .url' >> "$GITHUB_STEP_SUMMARY"
